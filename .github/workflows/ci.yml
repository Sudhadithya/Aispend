# This gets automatically triggered when a pull request is opened or when a commit is pushed to the main branch.

name: ci

# Controls when the action will run. Workflow runs when code is committed or pushed to main/feature branch
on:
  pull_request:
  push:
    branches: [main,feature/*]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aispend
          POSTGRES_PASSWORD: aispend
          POSTGRES_DB: aispend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aispend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://aispend:aispend@localhost:5432/aispend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --all-groups

      - run: uv run ruff check .

      - run: uv run pytest -q
