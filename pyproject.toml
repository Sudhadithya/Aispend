[project]
name = "aispend"
version = "0.1.0"
description = "AI toolchain cost observability: reverse proxy + MCP server"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.1",
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aispend"]
